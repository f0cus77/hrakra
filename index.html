<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover,interactive-widget=resizes-content">
<meta name="theme-color" media="(prefers-color-scheme: light)" content="#0f1a1c">
<meta name="theme-color" media="(prefers-color-scheme: dark)" content="#0f1a1c">
<meta name="description" content="Idle tycoon z malajské džungle: od sazenice po impérium.">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Ketum">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="/icons/icon-192.png">
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
<title>Ketum Empire</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>:root{--night:#0f1a1c;--night2:#162527;--jungle:#1d3b2f;--leaf:#9ad672;--leaf-d:#5f9a45;--gold:#ffc857;--gold-d:#c98d1c;--clay:#ef7a55;--clay-d:#a8442a;--cream:#f6f0de;--ink:#20160c;--mut:rgba(246,240,222,.62);--glass:rgba(12,22,24,.72);--line:rgba(246,240,222,.12);--font:'Baloo 2',ui-rounded,system-ui,-apple-system,'Segoe UI',sans-serif;--ease-out:cubic-bezier(.23,1,.32,1);--ease-drawer:cubic-bezier(.32,.72,0,1);--ease-io:cubic-bezier(.77,0,.175,1);--sat:max(env(safe-area-inset-top),0px);--sab:env(safe-area-inset-bottom);--top:calc(var(--sat) + 18px)}
*{box-sizing:border-box}
*{-webkit-tap-highlight-color:rgba(0,0,0,0);touch-action:pan-x pan-y}
html,body{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
input,textarea{-webkit-user-select:text;user-select:text;-webkit-touch-callout:default}
img,svg,canvas{-webkit-user-drag:none}
html{-webkit-text-size-adjust:100%;overscroll-behavior:none;background:#0b1415;height:100%}
html,body{margin:0;height:100%;overflow:hidden}
body{position:fixed;inset:0;background:#0b1415}
body{font-family:var(--font);color:var(--cream);font-variant-numeric:tabular-nums;font-size:16px;line-height:1.35}
button,[role=button]{font-family:inherit;color:inherit;border:0;background:none;padding:0;cursor:pointer}
input{font-family:inherit;font-size:16px}
svg{display:block}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px;border-radius:12px}
.hidden{display:none!important}
#app{position:fixed;top:0;right:0;bottom:0;left:0;display:flex;flex-direction:column}
#stage{position:relative;flex:1;overflow:hidden;touch-action:none;background:var(--night)}
#cv{position:absolute;inset:0;width:100%;height:100%;display:block}
#hot{position:absolute;inset:0;pointer-events:none}
#hot>*{pointer-events:auto}
#hud{position:absolute;left:0;right:0;top:0;padding:var(--top) 12px 26px;display:flex;justify-content:space-between;align-items:flex-start;gap:8px;z-index:5;pointer-events:none;background:linear-gradient(rgba(10,18,20,.78),rgba(10,18,20,.45) 60%,transparent)}
#hud>*{pointer-events:auto}
.cashbox{display:flex;flex-direction:column;align-items:flex-start;gap:2px}
.cash{display:flex;align-items:center;gap:8px;padding:4px 14px 4px 5px;border-radius:999px;background:var(--glass);border:1px solid var(--line);font-weight:800;font-size:24px;line-height:1.1;letter-spacing:-.01em}
.cash .coin{width:30px;height:30px;flex:none}
.cash.bump{animation:bump .22s var(--ease-out)}
.ips{font-size:13px;font-weight:700;color:var(--leaf);padding-left:12px}
.hudr{display:flex;gap:8px;align-items:center}
.heatbtn{display:flex;align-items:center;gap:8px;padding:5px 12px 5px 5px;border-radius:999px;background:var(--glass);border:1px solid var(--line);font-weight:700;font-size:13px;line-height:1.1;text-align:left;min-height:44px;transition:transform .14s var(--ease-out)}
.heatbtn:active{transform:scale(.97)}
.heatbtn svg{width:34px;height:34px;flex:none}
.heatbtn small{display:block;font-size:11px;font-weight:600;color:var(--mut)}
.avatar{width:44px;height:44px;border-radius:50%;background:var(--jungle);border:2px solid var(--leaf);font-weight:800;font-size:18px;display:grid;place-items:center;flex:none;transition:transform .14s var(--ease-out)}
.avatar:active{transform:scale(.95)}
#inv{position:absolute;left:10px;right:10px;top:calc(var(--top) + 82px);display:flex;gap:5px;z-index:4;pointer-events:none;flex-wrap:nowrap;overflow:hidden}
.chip{display:flex;align-items:center;gap:5px;padding:3px 9px 3px 4px;border-radius:999px;background:rgba(10,18,20,.6);border:1px solid var(--line);font-size:13px;font-weight:700;white-space:nowrap}
.chip i{width:20px;height:20px;border-radius:50%;display:grid;place-items:center;flex:none}
.chip i svg{width:13px;height:13px}
.chip span{color:var(--mut);font-weight:600;font-size:12px}
#ribbon{position:absolute;left:50%;top:calc(var(--top) + 118px);transform:translate(-50%,-8px);opacity:0;z-index:4;padding:6px 14px;border-radius:999px;font-size:13px;font-weight:700;white-space:nowrap;pointer-events:none;transition:opacity .25s var(--ease-out),transform .25s var(--ease-out)}
#ribbon.on{opacity:1;transform:translate(-50%,0)}
#ribbon.good{background:var(--leaf);color:#13200d}
#ribbon.bad{background:var(--clay);color:#2a0f06}
.pill{position:absolute;left:0;top:0;display:flex;align-items:center;gap:6px;min-height:40px;padding:4px 12px 4px 4px;border-radius:999px;font-weight:800;font-size:15px;line-height:1;white-space:nowrap;background:#2b3a36;color:var(--mut);box-shadow:0 3px 0 #17211f,0 6px 14px rgba(0,0,0,.35);transition:transform .14s var(--ease-out),background .2s,color .2s,box-shadow .2s;will-change:transform}
.pill::before{content:'';position:absolute;inset:-6px}
.pill:active{transform:var(--pos) scale(.95)!important}
.pill.ok{background:var(--gold);color:var(--ink);box-shadow:0 3px 0 var(--gold-d),0 6px 16px rgba(0,0,0,.35)}
.pill .lv{min-width:32px;height:32px;padding:0 8px;border-radius:999px;display:grid;place-items:center;background:var(--jungle);color:var(--leaf);font-size:14px}
.pill.ok .lv{background:var(--ink);color:var(--gold)}
.pill .cost{display:flex;align-items:center;gap:4px}
.pill .cost svg{width:16px;height:16px}
.pill.hub{padding:4px 14px 4px 4px;background:rgba(246,240,222,.94);color:var(--ink);box-shadow:0 3px 0 #b9ad8c,0 6px 14px rgba(0,0,0,.35)}
.pill.hub .lv{background:var(--jungle);color:var(--cream)}
.pill.hub .ico{width:32px;height:32px;border-radius:50%;background:var(--jungle);display:grid;place-items:center}
.pill.hub .ico svg{width:18px;height:18px;stroke:var(--leaf);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.pill.hub small{font-size:12px;font-weight:700;color:#6b5f45}
.pill.hub .dot{width:10px;height:10px;border-radius:50%;background:var(--gold);box-shadow:0 0 0 2px var(--ink);display:none}
.pill.hub.can .dot{display:block}
.pill.ghost{background:rgba(12,22,24,.55);color:var(--cream);border:2px dashed rgba(246,240,222,.45);box-shadow:none;padding:4px 12px 4px 6px}
.pill.ghost.ok{border-color:var(--gold);color:var(--gold);background:rgba(12,22,24,.7)}
.pill.ghost .plus{width:28px;height:28px;border-radius:50%;background:rgba(246,240,222,.12);display:grid;place-items:center}
.pill.ghost .plus svg{width:14px;height:14px}
.pill.neck::after{content:'!';position:absolute;top:-12px;right:-6px;width:22px;height:22px;border-radius:50%;background:var(--clay);color:#fff;font-size:15px;font-weight:800;display:grid;place-items:center;box-shadow:0 2px 0 var(--clay-d);animation:nudge 1.6s var(--ease-out) infinite}
.pill.pop{animation:pillpop .26s var(--ease-out)}
.pill.cap{opacity:.85}
#hint{position:absolute;left:0;top:0;z-index:4;pointer-events:none;padding:8px 14px;border-radius:14px;background:var(--cream);color:var(--ink);font-weight:800;font-size:14px;white-space:nowrap;box-shadow:0 4px 0 #b9ad8c,0 8px 20px rgba(0,0,0,.35);opacity:0;transition:opacity .25s var(--ease-out)}
#hint::after{content:'';position:absolute;left:50%;bottom:-7px;width:14px;height:14px;background:var(--cream);transform:translateX(-50%) rotate(45deg);border-radius:2px}
#hint.on{opacity:1;animation:hintbob 1.4s var(--ease-io) infinite}
@keyframes hintbob{50%{margin-top:-6px}}
html.fixh,html.fixh body{height:var(--appH)}
html.fixh #app,html.fixh #login{bottom:auto;height:var(--appH)}
.pill.sm{font-size:13px;min-height:34px;gap:4px;padding:3px 9px 3px 3px}
.pill.sm .lv{min-width:28px;height:28px;font-size:12px;padding:0 6px}
.pill.sm.ghost{padding:3px 9px 3px 4px}
.pill.nolbl>span:nth-child(2){display:none}
.pill.sm .cost svg{width:14px;height:14px}
#bags{position:absolute;display:flex;gap:6px;padding:6px;border-radius:18px;background:rgba(43,32,22,.86);border:2px solid #5a4330;box-shadow:0 4px 0 #2a1e14}
#bags button{display:flex;flex-direction:column;align-items:center;justify-content:flex-end;width:54px;height:64px;border-radius:12px;font-weight:800;font-size:13px;color:var(--mut);transition:transform .14s var(--ease-out),background .2s}
#bags button:active{transform:scale(.95)}
#bags button svg{margin-bottom:2px}
#bags button.on{background:var(--cream);color:var(--ink)}
#bags small{display:block;font-size:11px;font-weight:600;line-height:1}
#bags button.on small{color:#6b5f45}
#amt{position:absolute;right:12px;bottom:12px;z-index:4;min-width:56px;height:48px;padding:0 14px;border-radius:999px;background:var(--cream);color:var(--ink);font-weight:800;font-size:17px;box-shadow:0 3px 0 #b9ad8c,0 6px 16px rgba(0,0,0,.4);transition:transform .14s var(--ease-out)}
#amt:active{transform:scale(.95)}
#amt small{display:block;font-size:10px;font-weight:700;color:#6b5f45;line-height:1;margin-top:-2px}
nav{flex:none;display:flex;gap:6px;padding:8px 10px max(calc(var(--sab) - 6px),8px);background:#0b1415;border-top:1px solid var(--line);z-index:6}
nav button{flex:1;display:flex;flex-direction:column;align-items:center;gap:1px;padding:6px 0 4px;border-radius:16px;font-size:12px;font-weight:700;color:var(--mut);position:relative;min-height:52px;transition:transform .14s var(--ease-out),background .2s,color .2s}
nav button:active{transform:scale(.95)}
nav button svg{width:26px;height:26px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
nav button.on{background:var(--jungle);color:var(--cream);box-shadow:inset 0 -3px 0 var(--leaf)}
nav button .dot{position:absolute;top:6px;left:calc(50% + 10px);width:10px;height:10px;border-radius:50%;background:var(--gold);box-shadow:0 0 0 2px #0b1415;display:none}
nav button .dot.on{display:block}
#emp{position:absolute;inset:0;overflow-y:auto;-webkit-overflow-scrolling:touch;background:radial-gradient(120% 60% at 50% 0%,#1d3b2f,var(--night) 70%);padding:calc(var(--top) + 6px) 16px 32px;z-index:7;touch-action:pan-y;overscroll-behavior:contain}
#emp h2{font-size:22px;font-weight:800;margin:22px 4px 10px;letter-spacing:-.01em}
.prof{display:flex;align-items:center;gap:12px;padding:12px;border-radius:20px;background:rgba(246,240,222,.06);border:1px solid var(--line)}
.prof .avatar{width:52px;height:52px;font-size:22px}
.prof b{font-size:20px;display:block;line-height:1.1}
.prof span{font-size:13px;color:var(--mut)}
.prof .grow{flex:1;min-width:0}
.ghostbtn{padding:10px 14px;border-radius:14px;border:1px solid var(--line);font-weight:700;font-size:14px;min-height:44px;transition:transform .14s var(--ease-out)}
.ghostbtn:active{transform:scale(.97)}
.mapwrap{position:relative;border-radius:24px;overflow:hidden;background:#12302f;border:1px solid var(--line)}
.mapwrap svg{width:100%;height:auto}
.loccard{margin-top:10px;padding:14px;border-radius:20px;background:rgba(246,240,222,.06);border:1px solid var(--line)}
.loccard h3{margin:0;font-size:20px;font-weight:800}
.loccard p{margin:2px 0 10px;color:var(--mut);font-size:14px;max-width:60ch}
.stats3{display:flex;gap:16px;font-size:13px;color:var(--mut);font-weight:600;margin-bottom:12px}
.stats3 b{color:var(--cream)}
.cta{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;min-height:52px;padding:10px 16px;border-radius:16px;font-weight:800;font-size:17px;background:#2b3a36;color:var(--mut);box-shadow:0 4px 0 #17211f;transition:transform .14s var(--ease-out),background .2s}
.cta:active{transform:translateY(2px) scale(.98)}
.cta.ok{background:var(--gold);color:var(--ink);box-shadow:0 4px 0 var(--gold-d)}
.cta svg{width:20px;height:20px;flex:none}
.cta{white-space:nowrap}
.upg{display:flex;align-items:center;gap:12px;padding:10px 10px 10px 12px;border-radius:18px;background:rgba(246,240,222,.06);border:1px solid var(--line);margin-bottom:8px}
.upg .ui{width:40px;height:40px;border-radius:12px;background:var(--jungle);display:grid;place-items:center;flex:none}
.upg .ui svg{width:22px;height:22px;stroke:var(--leaf);fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.upg .ut{flex:1;min-width:0}
.upg b{display:block;font-size:15px;line-height:1.2}
.upg span{font-size:13px;color:var(--mut)}
.upg .cta{width:auto;min-width:104px;font-size:15px;min-height:44px;flex:none}
.upg.done{opacity:.5}
.statgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.stat{padding:12px;border-radius:16px;background:rgba(246,240,222,.06);border:1px solid var(--line)}
.stat span{display:block;font-size:13px;color:var(--mut);font-weight:600}
.stat b{font-size:20px;font-weight:800}
.danger{width:100%;margin-top:12px;min-height:48px;border-radius:14px;border:1px solid rgba(239,122,85,.4);color:var(--clay);font-weight:700;font-size:15px}
#scrim{position:fixed;inset:0;z-index:20;background:rgba(5,10,11,.5);opacity:0;pointer-events:none;transition:opacity .3s var(--ease-out)}
#scrim.on{opacity:1;pointer-events:auto}
#sheet{position:fixed;left:0;right:0;bottom:0;z-index:21;max-width:560px;margin:0 auto;max-height:78dvh;overflow-y:auto;border-radius:26px 26px 0 0;background:#17292a;border-top:1px solid var(--line);padding:8px 16px calc(var(--sab) + 18px);transform:translateY(100%);transition:transform .42s var(--ease-drawer);touch-action:pan-y;overscroll-behavior:contain}
#sheet.on{transform:translateY(0)}
#sheet .grab{width:44px;height:5px;border-radius:99px;background:rgba(246,240,222,.25);margin:4px auto 12px}
.sh-h{display:flex;align-items:center;gap:12px;margin-bottom:12px}
.sh-h .ui{width:48px;height:48px;border-radius:16px;background:var(--jungle);display:grid;place-items:center}
.sh-h .ui svg{width:26px;height:26px;stroke:var(--leaf);fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.sh-h h3{margin:0;font-size:22px;font-weight:800;line-height:1.1}
.sh-h p{margin:0;font-size:14px;color:var(--mut)}
.sh-h .rate{margin-left:auto;font-weight:800;color:var(--leaf);font-size:16px;white-space:nowrap}
.slotrow{display:flex;align-items:center;gap:12px;padding:10px;border-radius:18px;background:rgba(246,240,222,.06);margin-bottom:8px}
.slotrow .lvb{width:48px;height:48px;border-radius:14px;background:var(--jungle);display:flex;flex-direction:column;align-items:center;justify-content:center;flex:none;font-weight:800;color:var(--leaf);font-size:18px;line-height:1}
.slotrow .lvb small{font-size:10px;color:var(--mut);font-weight:700}
.slotrow .st{flex:1;min-width:0}
.slotrow b{display:block;font-size:15px}
.slotrow span{display:block;font-size:13px;color:var(--mut);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.slotrow .cta small{font-size:12px;opacity:.75;margin-right:-2px}
.slotrow .bar{height:5px;border-radius:99px;background:rgba(246,240,222,.1);margin-top:5px;overflow:hidden}
.slotrow .bar i{display:block;height:100%;background:var(--leaf);border-radius:99px;transition:width .3s var(--ease-out)}
.slotrow .cta{width:auto;min-width:104px;font-size:15px;min-height:46px;flex:none;gap:5px;white-space:nowrap}
.slotrow.locked{background:transparent;border:2px dashed var(--line)}
.slotrow.off{opacity:.4}
.sh-note{font-size:13px;color:var(--mut);margin:6px 4px 0}
.ov{position:fixed;inset:0;z-index:30;display:none;align-items:center;justify-content:center;background:rgba(5,10,11,.66);padding:20px}
.ov.show{display:flex;animation:fadein .2s var(--ease-out)}
.modal{width:min(100%,360px);background:#17292a;border:1px solid var(--line);border-radius:26px;padding:24px 20px 18px;text-align:center;animation:modalin .3s var(--ease-out)}
.modal h2{margin:0 0 6px;font-size:26px;font-weight:800}
.modal p{margin:0 0 6px;color:var(--mut);font-size:15px;line-height:1.45}
.modal .big{font-size:38px;font-weight:800;margin:8px 0;letter-spacing:-.01em}
.modal .cta{margin-top:14px}
.float{position:fixed;z-index:25;pointer-events:none;font-weight:800;font-size:17px;color:var(--cream);text-shadow:0 2px 0 rgba(0,0,0,.45),0 0 14px rgba(0,0,0,.6);animation:floatup .9s var(--ease-out) forwards;transform:translate(-50%,-50%);white-space:nowrap}
.float.g{color:var(--gold)}
.float.l{color:var(--leaf)}
.float.b{color:var(--clay)}
.toast{position:fixed;left:50%;bottom:calc(var(--sab) + 90px);z-index:26;padding:10px 16px;border-radius:999px;background:var(--cream);color:var(--ink);font-weight:800;font-size:15px;box-shadow:0 6px 20px rgba(0,0,0,.4);transform:translate(-50%,0);transition:transform .4s ease,opacity .4s ease;white-space:nowrap}
.toast.out{opacity:0;transform:translate(-50%,12px)}
@starting-style{.toast{opacity:0;transform:translate(-50%,12px)}
}
.shake{animation:shake .4s var(--ease-io)}
#login{position:fixed;top:0;right:0;bottom:0;left:0;z-index:40;display:flex;flex-direction:column;justify-content:flex-end;overflow-y:auto;background:var(--night);touch-action:pan-y}
#lcv{position:fixed;inset:0;width:100%;height:100%;pointer-events:none}
.lbox{position:relative;padding:calc(var(--top) + 8px) 20px calc(var(--sab) + 24px);max-width:460px;width:100%;margin:0 auto}
.logo{font-weight:800;font-size:54px;line-height:.9;letter-spacing:-.03em;margin:0;color:var(--cream);text-shadow:0 4px 0 rgba(0,0,0,.35)}
.logo span{display:block;color:var(--leaf);font-size:30px;letter-spacing:-.01em}
.tag{margin:10px 0 20px;color:var(--mut);font-size:16px;max-width:34ch}
.lpanel{padding:16px;border-radius:24px;background:rgba(15,26,28,.86);border:1px solid var(--line);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px)}
.lpanel h2{margin:0 0 10px;font-size:18px;font-weight:800}
.plist{display:flex;flex-direction:column;gap:8px;margin-bottom:16px}
.prow{display:flex;align-items:center;gap:12px;padding:10px 12px 10px 10px;border-radius:18px;background:rgba(246,240,222,.07);text-align:left;min-height:60px;transition:transform .14s var(--ease-out)}
.prow:active{transform:scale(.98)}
.prow .avatar{width:42px;height:42px;font-size:17px}
.prow b{display:block;font-size:17px;line-height:1.1}
.prow span{font-size:13px;color:var(--mut)}
.prow .lock{margin-left:auto;width:20px;height:20px;opacity:.6}
.field{display:block;margin-bottom:12px}
.field label{display:block;font-size:14px;font-weight:700;margin:0 0 4px 4px}
.field input{width:100%;height:52px;padding:0 16px;border-radius:16px;border:2px solid var(--line);background:rgba(246,240,222,.06);color:var(--cream);font-weight:700;font-size:18px;outline:none;transition:border-color .2s}
.field input:focus{border-color:var(--leaf)}
.field .help{font-size:13px;color:var(--mut);margin:4px 4px 0}
.err{color:var(--clay);font-size:14px;font-weight:700;margin:-4px 4px 10px;min-height:0}
.check{display:flex;gap:10px;align-items:center;font-size:14px;font-weight:600;margin:0 4px 12px}
.check input{width:22px;height:22px;accent-color:var(--leaf)}
.fine{font-size:12px;color:var(--mut);margin:12px 4px 0;text-align:center}
@keyframes bump{50%{transform:scale(1.06)}
}
@keyframes pillpop{0%{transform:var(--pos) scale(.96)}
